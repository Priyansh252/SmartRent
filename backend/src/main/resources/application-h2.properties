# Lightweight no-Docker profile:  mvn spring-boot:run -Dspring-boot.run.profiles=h2
# File-based H2 (data persists in ./data) + embedded Artemis broker (in-JVM, still a real JMS broker with a
# producer, queue and listener). Flyway scripts are MySQL-specific, so this profile lets Hibernate create the schema.
spring.datasource.url=jdbc:h2:file:./data/smartrent;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.batch.jdbc.initialize-schema=always
spring.artemis.mode=embedded
spring.artemis.embedded.persistent=true
spring.artemis.embedded.data-directory=./data/artemis
spring.artemis.embedded.queues=smartrent.booking.events
spring.artemis.user=
spring.artemis.password=
