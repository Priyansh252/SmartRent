# Test configuration: in-memory H2 + embedded Artemis broker. Flyway (MySQL scripts) is off; Hibernate builds the schema.
spring.datasource.url=jdbc:h2:mem:smartrent_test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
spring.artemis.mode=embedded
spring.artemis.embedded.persistent=false
spring.artemis.embedded.queues=smartrent.booking.events
spring.artemis.user=
spring.artemis.password=
spring.thymeleaf.cache=false
smartrent.seed.enabled=true
smartrent.seed.admin-password=Admin@123
smartrent.seed.employee-password=Employee@123
smartrent.seed.customer-password=Customer@123
smartrent.reports.output-dir=target/test-reports
smartrent.reports.scheduler-enabled=false
smartrent.outbox.poll-interval-ms=3600000
