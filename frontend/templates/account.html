<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments :: head('My account')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="container">
<div id="account-root" th:data-role="${#authorization.expression('hasRole(''ADMIN'')') ? 'ADMIN' : (#authorization.expression('hasRole(''EMPLOYEE'')') ? 'EMPLOYEE' : 'CUSTOMER')}">
  <h1 class="page-title">My bookings</h1>
  <div id="bookings"></div><div id="bk-pager" class="pager"></div>
  <h2>Notifications</h2>
  <p class="muted small">Delivered asynchronously through the JMS queue.</p>
  <div id="notes"></div><div id="note-pager" class="pager"></div>
</div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
<script th:src="@{/js/account.js}" defer></script>
</body>
</html>
