<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments :: head('Vehicle')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="container">
<div id="vehicle-root" th:data-id="${vehicleId}" th:data-authed="${#authorization.expression('isAuthenticated()')}" th:data-role="${#authorization.expression('hasRole(''ADMIN'')') ? 'ADMIN' : (#authorization.expression('hasRole(''EMPLOYEE'')') ? 'EMPLOYEE' : 'CUSTOMER')}">
  <div class="layout-2">
    <section>
      <div class="gallery-pic"><img id="pic" src="" alt="Vehicle"></div>
      <div id="info"><div class="state"><div class="spinner"></div>Loading vehicle...</div></div>
      <h3>Already booked</h3>
      <div id="booked" class="chips"></div>
    </section>
    <aside class="card">
      <h2>Price and booking</h2>
      <form id="book-form" novalidate>
        <div class="field"><label for="b-pick">Pickup date</label><input id="b-pick" type="date" name="pickupDate" required></div>
        <div class="field"><label for="b-ret">Return date (not charged)</label><input id="b-ret" type="date" name="returnDate" required></div>
        <div id="quote"></div>
        <div id="book-msg" aria-live="polite"></div>
        <button id="book-btn" class="btn btn-block" type="submit">Book this vehicle</button>
        <p class="muted small" sec:authorize="!isAuthenticated()">You will be asked to <a th:href="@{/login}">sign in</a> as a customer to book.</p>
      </form>
    </aside>
  </div>
</div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
<script th:src="@{/js/vehicle-detail.js}" defer></script>
</body>
</html>
