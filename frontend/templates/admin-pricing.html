<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments :: head('Pricing configuration')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="container">
<h1 class="page-title">Pricing configuration</h1>
<p class="muted">Changes apply to new quotes only. Confirmed bookings keep the price agreed at booking time. <span id="updated"></span></p>
<div class="layout-2">
  <section>
    <form id="pricing-form" class="card grid g2" novalidate><div class="field"><label>Weekend surcharge (fraction)</label><input name="weekendSurcharge" type="number" step="any" required><span class="err"></span></div><div class="field"><label>Demand window (days)</label><input name="demandWindowDays" type="number" step="any" required><span class="err"></span></div><div class="field"><label>Demand baseline (bookings)</label><input name="demandBaseline" type="number" step="any" required><span class="err"></span></div><div class="field"><label>Demand weight</label><input name="demandWeight" type="number" step="any" required><span class="err"></span></div><div class="field"><label>Max demand surcharge</label><input name="maxDemandSurcharge" type="number" step="any" required><span class="err"></span></div><div class="field"><label>Max demand discount</label><input name="maxDemandDiscount" type="number" step="any" required><span class="err"></span></div><div class="field"><label>Availability weight</label><input name="availabilityWeight" type="number" step="any" required><span class="err"></span></div><div class="field"><label>Availability threshold (fraction free)</label><input name="availabilityThreshold" type="number" step="any" required><span class="err"></span></div><div class="field"><label>Discount 7+ days</label><input name="discount7Days" type="number" step="any" required><span class="err"></span></div><div class="field"><label>Discount 14+ days</label><input name="discount14Days" type="number" step="any" required><span class="err"></span></div><div class="field"><label>Discount 30+ days</label><input name="discount30Days" type="number" step="any" required><span class="err"></span></div><div class="field"><label>Min total multiplier</label><input name="minMultiplier" type="number" step="any" required><span class="err"></span></div><div class="field"><label>Max total multiplier</label><input name="maxMultiplier" type="number" step="any" required><span class="err"></span></div><div class="field"><label>Free cancellation (days before pickup)</label><input name="freeCancelDays" type="number" step="any" required><span class="err"></span></div><div class="field"><label>Late cancellation fee rate</label><input name="lateCancelFeeRate" type="number" step="any" required><span class="err"></span></div>
      <div style="grid-column:1/-1"><div id="pricing-msg"></div><button class="btn" type="submit">Save pricing rules</button></div>
    </form>
    <h2>Peak periods</h2><div id="peaks"></div>
    <form id="peak-form" class="card grid g2">
      <div class="field"><label>Name</label><input name="name" required></div>
      <div class="field"><label>Surcharge (0.25 = +25%)</label><input name="surcharge" type="number" step="0.01" min="0" required></div>
      <div class="field"><label>Start date</label><input name="startDate" type="date" required></div>
      <div class="field"><label>End date (inclusive)</label><input name="endDate" type="date" required></div>
      <div><button class="btn" type="submit">Add peak period</button></div>
    </form>
  </section>
  <aside class="card"><h3>Try the rules</h3>
    <form id="try-form"><div class="field"><label>Vehicle</label><select id="try-vehicle"></select></div>
      <div class="field"><label>Pickup</label><input name="pickupDate" type="date" required></div>
      <div class="field"><label>Return</label><input name="returnDate" type="date" required></div>
      <button class="btn btn-block" type="submit">Calculate</button></form>
    <div id="try-out"></div>
  </aside>
</div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
<script th:src="@{/js/admin-pricing.js}" defer></script>
</body>
</html>
