<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments :: head('Sign in')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="container">
<div class="auth-card card">
  <h1>Sign in</h1>
  <div class="alert bad" th:if="${param.error}">Incorrect e-mail or password, or the account is disabled.</div>
  <div class="alert ok" th:if="${param.registered}">Account created. Please sign in.</div>
  <div class="alert ok" th:if="${param.logout}">You have been signed out.</div>
  <form th:action="@{/login}" method="post">
    <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" required autocomplete="username"></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password"></div>
    <button class="btn btn-block" type="submit">Sign in</button>
  </form>
  <p class="muted small">New here? <a th:href="@{/register}">Create a customer account</a>. Demo credentials are listed in the README.</p>
</div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
