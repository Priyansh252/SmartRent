<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments :: head('Admin')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="container">
<div id="admin-root">
  <h1 class="page-title">Administration</h1>
  <div class="tabs" role="tablist">
    <button type="button" data-tab="overview">Overview</button><button type="button" data-tab="fleet">Fleet</button><button type="button" data-tab="bookings">Bookings</button>
    <button type="button" data-tab="users">Users</button><button type="button" data-tab="events">Notifications &amp; JMS</button><button type="button" data-tab="audit">Audit log</button>
  </div>
  <section class="panel" data-panel="overview"><div id="kpis" class="stats"></div><div id="charts"></div></section>
  <section class="panel" data-panel="fleet" hidden>
    <div class="row between"><h2>Vehicles</h2><div><a class="btn btn-ghost btn-sm" th:href="@{/api/admin/export/vehicles.csv}">Export CSV</a> <button id="add-vehicle" class="btn btn-sm" type="button">Add vehicle</button></div></div>
    <div id="vehicle-form-card" class="card" hidden>
      <h3 id="vehicle-form-title">Add vehicle</h3>
      <form id="vehicle-form" class="grid g3" novalidate>
        <input type="hidden" name="id">
        <div class="field"><label>Registration</label><input name="registrationNumber" required><span class="err"></span></div>
        <div class="field"><label>Make</label><input name="make" required><span class="err"></span></div>
        <div class="field"><label>Model</label><input name="model" required><span class="err"></span></div>
        <div class="field"><label>Model year</label><input name="modelYear" type="number" min="1990" required><span class="err"></span></div>
        <div class="field"><label>Type</label><select name="vehicleType"></select></div>
        <div class="field"><label>Fuel</label><select name="fuelType"></select></div>
        <div class="field"><label>Transmission</label><select name="transmission"></select></div>
        <div class="field"><label>Seats</label><input name="seats" type="number" min="1" max="20" required><span class="err"></span></div>
        <div class="field"><label>Daily rate (INR)</label><input name="dailyRate" type="number" min="1" step="0.01" required><span class="err"></span></div>
        <div class="field"><label>Location</label><select name="locationId"></select></div>
        <div class="field"><label>Mileage (km)</label><input name="mileageKm" type="number" min="0" value="0"><span class="err"></span></div>
        <div class="field"><label>Status</label><select name="status"><option>AVAILABLE</option><option>MAINTENANCE</option><option>RETIRED</option></select></div>
        <div class="field" style="grid-column:1/-1"><label>Description</label><textarea name="description" rows="2"></textarea></div>
        <div style="grid-column:1/-1"><div id="vehicle-msg"></div><button class="btn" type="submit">Save vehicle</button> <button id="cancel-vehicle" class="btn btn-ghost" type="button">Cancel</button></div>
      </form>
    </div>
    <div id="fleet"></div><div id="fleet-pager" class="pager"></div>
  </section>
  <section class="panel" data-panel="bookings" hidden>
    <div class="row between"><h2>Bookings</h2><div class="row"><select id="bk-status" aria-label="Filter by status"></select> <a class="btn btn-ghost btn-sm" th:href="@{/api/admin/export/bookings.csv}">Export CSV</a></div></div>
    <div id="bookings"></div><div id="bk-pager" class="pager"></div>
  </section>
  <section class="panel" data-panel="users" hidden>
    <h2>Users</h2><div id="users"></div><div id="user-pager" class="pager"></div>
    <div class="card"><h3>Create staff or customer account</h3>
      <form id="user-form" class="grid g3">
        <div class="field"><label>Full name</label><input name="fullName" required></div>
        <div class="field"><label>E-mail</label><input name="email" type="email" required></div>
        <div class="field"><label>Phone</label><input name="phone"></div>
        <div class="field"><label>Password</label><input name="password" type="password" minlength="8" required autocomplete="new-password"></div>
        <div class="field"><label>Role</label><select name="role"><option>CUSTOMER</option><option>EMPLOYEE</option><option>ADMIN</option></select></div>
        <div class="field"><label>&nbsp;</label><button class="btn" type="submit">Create</button></div>
      </form><div id="user-msg"></div></div>
  </section>
  <section class="panel" data-panel="events" hidden>
    <h2>Notification history</h2><div id="notif-list"></div>
    <h2>Outbox (events waiting for or sent to the broker)</h2><div id="outbox-list"></div>
  </section>
  <section class="panel" data-panel="audit" hidden><h2>Administrative audit log</h2><div id="audit-list"></div></section>
</div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
<script th:src="@{/js/admin.js}" defer></script>
</body>
</html>
