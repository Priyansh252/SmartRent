<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments :: head('Register')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="container">
<div class="auth-card card">
  <h1>Create account</h1>
  <form id="register-form" novalidate>
    <div class="field"><label for="r-name">Full name</label><input id="r-name" name="fullName" required maxlength="120"><span class="err"></span></div>
    <div class="field"><label for="r-email">E-mail</label><input id="r-email" name="email" type="email" required><span class="err"></span></div>
    <div class="field"><label for="r-phone">Phone (optional)</label><input id="r-phone" name="phone" type="tel"><span class="err"></span></div>
    <div class="field"><label for="r-pw">Password (8+ characters)</label><input id="r-pw" name="password" type="password" minlength="8" required autocomplete="new-password"><span class="err"></span></div>
    <div class="field"><label for="r-pw2">Confirm password</label><input id="r-pw2" name="confirm" type="password" required autocomplete="new-password"></div>
    <div id="form-msg" aria-live="polite"></div>
    <button class="btn btn-block" type="submit">Register</button>
  </form>
  <p class="muted small">Already registered? <a th:href="@{/login}">Sign in</a>.</p>
</div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
<script th:src="@{/js/auth.js}" defer></script>
</body>
</html>
